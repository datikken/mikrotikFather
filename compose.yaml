services:
  cli:
    build:
      context: .
      dockerfile: Dockerfile.cli
    profiles:
      - cli
    stdin_open: true
    tty: true
    working_dir: ${PWD:?run docker compose from the project directory}
    volumes:
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OVPN_PROJECT_DIRECTORY: ${PWD:?run docker compose from the project directory}
  openvpn:
    image: kylemanna/openvpn:latest
    container_name: openvpn-server
    cap_add:
      - NET_ADMIN
    ports:
      - "1194:1194/udp"
    restart: unless-stopped
    volumes:
      - ./data:/etc/openvpn
  openvpn-admin:
    image: flant/ovpn-admin:2.0.2
    command: ["/app/ovpn-admin"]
    profiles:
      - admin
    depends_on:
      - openvpn
    network_mode: "service:openvpn"
    restart: unless-stopped
    environment:
      OVPN_LISTEN_HOST: 0.0.0.0
      OVPN_LISTEN_PORT: "8080"
      OVPN_NETWORK: 10.8.0.0/24
      OVPN_SERVER: 185.219.43.239:1194:udp
      OVPN_MGMT: main=127.0.0.1:8989
      OVPN_CCD: "true"
      OVPN_CCD_PATH: /mnt/ccd
      EASYRSA_PATH: /mnt/easyrsa
      OVPN_INDEX_PATH: /mnt/easyrsa/pki/index.txt
      LOG_LEVEL: info
    volumes:
      - ./data:/mnt/easyrsa
      - ./data/ccd:/mnt/ccd
  nginx:
    image: nginx:alpine
    profiles:
      - admin
    depends_on:
      - openvpn-admin
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/auth:/etc/nginx/auth:ro
      - ./nginx/certs:/etc/nginx/certs:ro
